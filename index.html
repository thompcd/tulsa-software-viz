<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tulsa Software Viz</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Georgia', serif; color: #1a1a1a; background: #fafafa; }
    .hero { max-width: 720px; margin: 4rem auto; padding: 0 1.5rem; text-align: center; }
    .hero h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .hero p { font-size: 1.2rem; color: #666; }
    .stories { max-width: 720px; margin: 2rem auto; padding: 0 1.5rem; }
    .stories a { display: block; padding: 1.5rem; margin-bottom: 1rem; border: 1px solid #e0e0e0; border-radius: 8px; text-decoration: none; color: inherit; transition: box-shadow 0.2s; }
    .stories a:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Tulsa Software</h1>
    <p>Data-driven storytelling from the heartland</p>
  </div>
  <div class="stories" id="stories">
    <!-- Stories populate here -->
  </div>
</body>
</html>
